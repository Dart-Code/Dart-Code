coverage:
  status:
    project:
      default:
        # Allow up to a 0.5% drop from current overall coverage.
        target: auto
        threshold: 0.5
        paths:
          - "src/extension"
          - "src/shared"
        # Only report on PRs, as master commits are merge queue groups.
        only_pulls: true
        if_ci_failed: success
    patch:
      default:
        # Allow up to 30% below current coverage for this patch.
        target: auto
        threshold: 30
        paths:
          - "src/extension"
          - "src/shared"
        # Only report on PRs, as master commits are merge queue groups.
        only_pulls: true
        if_ci_failed: success
