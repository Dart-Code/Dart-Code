name: Nightly Build

on:
  schedule:
     # 1:50am UTC Mon-Fri (scheduled early and off-hour due to GitHub cron delays).
     - cron: '50 1 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:

  build:

    name: "Package Extension"
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm ci
        run: npm ci

      - name: npm lint
        run: npm run lint

      - name: npm build
        run: npm run vscode:prepublish

      - name: set version
        run: |
          CURRENT_VERSION=$(node -p -e "require('./extensions/dart/package.json').version")
          NEW_VERSION="$CURRENT_VERSION.$(date +%F)"
          npm --prefix extensions/dart version "$NEW_VERSION" --no-git-tag-version

      - name: vsce package
        run: (cd extensions/dart && ../../node_modules/.bin/vsce package --no-dependencies -o ../..)

      - name: Store vsix
        uses: actions/upload-artifact@v7
        with:
          name: nightly-build-vsix
          path: "*.vsix"
          if-no-files-found: error


  notify_failure:

    permissions:
      contents: none
    name: Notify Discord of Failure
    needs: build
    if: failure()
    runs-on: ubuntu-latest

    steps:

      - name: Send notification to Discord
        run: 'if ($env:DISCORD_WEBHOOK) { Invoke-WebRequest -Headers @{ "Content-Type" = "application/json" } -Method Post -Body "{`"content`":`"Nightly build packaging failed on $($env:GITHUB_REF.Replace(`"refs/heads/`", `"`")): https://github.com/$($env:GITHUB_REPOSITORY)/commit/$($env:GITHUB_SHA)/checks`"}" -Uri $env:DISCORD_WEBHOOK }'
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
