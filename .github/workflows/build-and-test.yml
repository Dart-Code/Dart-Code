name: Run Tests

on:
  push:
    branches:
      - master
    tags:
      - '**'
  pull_request:
  # Run on merge queue groups.
  merge_group:
    types: [ checks_requested ]
  schedule:
     - cron: '0 6 * * 1' # 6am Monday
  workflow_dispatch:

jobs:


  build_exclusions:

    permissions:
      contents: none
    runs-on: ubuntu-latest
    outputs:
      excludes: ${{ join(steps.*.outputs.excludes) }}
      run_tests: ${{ github.event_name != 'merge_group' }}
      check_links: ${{ github.event_name != 'merge_group' }}
    steps:
      - id: no_exclude
        name: Run all builds
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        # We only exclude:
        # - beta versions of "other IDEs" that don't have insiders versions
        # - non-Linux / beta versions of flutter_snap
        run: echo 'excludes=[{"build-version":"beta","bot":"dart-antigravity"},{"build-version":"beta","bot":"dart_debug-antigravity"},{"build-version":"beta","bot":"flutter_snap"},{"os":"windows-latest","bot":"flutter_snap"},{"os":"macos-latest","bot":"flutter_snap"}]' >> $GITHUB_OUTPUT
      - id: exclude
        name: Exclude some builds if not running on schedule
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') && github.event_name != 'merge_group'
        # Exclude:
        # - all betas
        # - windows
        # - macOS
        run: echo 'excludes=[{"build-version":"beta"},{"os":"windows-latest"},{"os":"macos-latest"}]' >> $GITHUB_OUTPUT
      - id: exclude_merge_group
        name: Exclude all builds except misc if running on merge queue
        if: github.event_name == 'merge_group'
        # Exclude everything except misc (stable, ubuntu-latest), which will just run lint/build.
        run: echo 'excludes=[{"build-version":"beta"},{"os":"windows-latest"},{"os":"macos-latest"},{"bot":"flutter_debug"},{"bot":"flutter_debug_chrome"},{"bot":"flutter_test_debug"},{"bot":"dart_web_debug"},{"bot":"flutter_repo"},{"bot":"dart_debug"},{"bot":"dart"},{"bot":"flutter"},{"bot":"flutter_snap"},{"bot":"dart-antigravity"},{"bot":"dart_debug-antigravity"}]' >> $GITHUB_OUTPUT

  build:

    name: "${{ matrix.bot }} (${{ matrix.build-version }} ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: build_exclusions

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
        node-version: [22]
        build-version: [stable, beta]
        bot: [flutter_debug, flutter_debug_chrome, flutter_test_debug, dart_web_debug, flutter_repo, dart_debug, dart, flutter, flutter_snap, misc, dart-antigravity, dart_debug-antigravity]
        exclude: ${{ fromJSON(needs.build_exclusions.outputs.excludes) }}

    env:
      RUN_TESTS: ${{ needs.build_exclusions.outputs.run_tests }}
      # Both dart* and misc bots need the standalone Dart SDK.
      NEEDS_DART: ${{ needs.build_exclusions.outputs.run_tests == 'true' && (startsWith(matrix.bot, 'dart') || matrix.bot == 'misc') }}
      # Both flutter* (except flutter_snap, which installs via snap) and misc bots need the Flutter SDK.
      NEEDS_FLUTTER: ${{ needs.build_exclusions.outputs.run_tests == 'true' && ((startsWith(matrix.bot, 'flutter') && matrix.bot != 'flutter_snap') || matrix.bot == 'misc') }}

    steps:

      - uses: actions/checkout@v7

      # upload-artifact fails if the path does not exist (it only supports
      # silent failure for no-files-found, but the path must exist), so
      # ensure these folders exist so that if the build/lint fails we don't
      # get additional failures reported on the artifact uploads that make
      # it less clear what the failure is.
      - run: |
          mkdir -p .crash_dumps
          mkdir -p .dart_code_test_logs
          mkdir -p .test_results
          mkdir -p coverage
        shell: pwsh

      - name: Set up XVFB
        if: matrix.os == 'ubuntu-latest'
        run: Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &

      - name: Set up Node v${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Antigravity (Linux)
        if: endsWith(matrix.bot, '-antigravity') && matrix.os == 'ubuntu-latest'
        run: |
          sudo mkdir -p /etc/apt/keyrings
          curl -fsSL https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg | sudo gpg --dearmor --yes -o /etc/apt/keyrings/antigravity-repo-key.gpg
          echo "deb [signed-by=/etc/apt/keyrings/antigravity-repo-key.gpg] https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev antigravity-debian main" | sudo tee /etc/apt/sources.list.d/antigravity.list
          sudo apt-get update && sudo apt-get install antigravity -y
          echo "ANTIGRAVITY_EXE=/usr/share/antigravity/antigravity" >> "$GITHUB_ENV"
        shell: bash

      - name: Install Antigravity (macOS)
        if: endsWith(matrix.bot, '-antigravity') && matrix.os == 'macOS-latest'
        run: |
          brew install --cask antigravity-ide
          echo "ANTIGRAVITY_EXE=/Applications/Antigravity IDE.app/Contents/MacOS/Electron" >> "$GITHUB_ENV"
        shell: bash

      - name: Install Antigravity (Windows)
        if: endsWith(matrix.bot, '-antigravity') && matrix.os == 'windows-latest'
        # HACK: We can use:
        #     Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1"
        #     refreshenv
        # To update PATH, but it goes to the `bin` folder and we want the .exe, so we just
        # hard-code it for now.
        run: |
          choco install antigravity-ide --yes
          "ANTIGRAVITY_EXE=C:\Users\runneradmin\AppData\Local\Programs\Antigravity IDE\Antigravity IDE.exe" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Set up Flutter ${{ matrix.build-version }}
        id: flutter
        if: env.NEEDS_FLUTTER == 'true'
        uses: DanTup/gh-actions/setup-flutter@27c44eb7d43bced080fc5c9b6c3e4cfdd4cdcc41
        with:
          channel: ${{ matrix.build-version }}

      - name: Set up Dart ${{ matrix.build-version }}
        if: env.NEEDS_DART == 'true'
        uses: dart-lang/setup-dart@6e0ff0bc3a029a9532ae6a86b1ea4906038921bc
        with:
          sdk: ${{ matrix.build-version }}

      - name: Set up Flutter (snap) w/ DBUS_SESSION_BUS_ADDRESS fix
        run: |
          sudo snap install flutter --classic
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> $GITHUB_ENV
        if: matrix.bot == 'flutter_snap'

      - run: dart --disable-analytics
        if: env.NEEDS_DART == 'true' || env.NEEDS_FLUTTER == 'true'

      - run: flutter config --no-analytics
        if: env.NEEDS_FLUTTER == 'true'

      - run: flutter update-packages
        if: matrix.bot == 'flutter_repo'

      - name: Print Dart version
        if: env.NEEDS_DART == 'true' || env.NEEDS_FLUTTER == 'true'
        run: dart --version

      - name: Print Flutter version
        if: env.NEEDS_FLUTTER == 'true'
        run: flutter --version

      - name: Flutter precache
        if: matrix.bot == 'flutter_debug_chrome'
        run: flutter precache --web

      - run: |
          dart pub global activate --no-executables crypto
          dart pub global activate --no-executables webdev
          dart pub global activate --no-executables args 2.3.0
          dart pub global activate --no-executables meta 1.7.0
          dart pub global activate --no-executables lints 1.0.0
          dart pub global activate --no-executables json_annotation 4.0.1
        if: env.NEEDS_DART == 'true' || env.NEEDS_FLUTTER == 'true'
        shell: pwsh

      - name: npm install
        run: npm install

      - name: npm lint
        run: npm run lint

      - name: npm build
        run: npm run build

      - name: npm build-tests
        if: env.RUN_TESTS != 'true'
        run: npm run build-tests

      - name: dart pub get (hello_world)
        if: startsWith(matrix.bot, 'dart')
        run: dart pub get
        working-directory: src/test/test_projects/hello_world

      - name: dart pub get (hello_world/example)
        if: startsWith(matrix.bot, 'dart')
        run: dart pub get
        working-directory: src/test/test_projects/hello_world/example

      - name: dart pub get (dart_nested)
        if: env.RUN_TESTS == 'true' && matrix.bot == 'misc'
        run: dart pub get
        working-directory: src/test/test_projects/dart_nested

      - name: dart pub get (dart_nested/nested1)
        if: env.RUN_TESTS == 'true' && matrix.bot == 'misc'
        run: dart pub get
        working-directory: src/test/test_projects/dart_nested/nested1

      - name: dart pub get (web/hello_world)
        if: startsWith(matrix.bot, 'dart_web')
        run: dart pub get
        working-directory: src/test/test_projects/web/hello_world

      - name: dart pub get (web/broken)
        if: startsWith(matrix.bot, 'dart_web')
        run: dart pub get
        working-directory: src/test/test_projects/web/broken

      - name: dart pub get (dart_nested/nested1/nested2)
        if: env.RUN_TESTS == 'true' && matrix.bot == 'misc'
        run: dart pub get
        working-directory: src/test/test_projects/dart_nested/nested1/nested2

      - name: flutter pub get (dart_nested_flutter/nested_flutter_example)
        if: env.RUN_TESTS == 'true' && matrix.bot == 'misc'
        run: flutter pub get
        working-directory: src/test/test_projects/dart_nested_flutter/nested_flutter_example

      - name: flutter pub get (dart_nested_flutter2/nested_flutter_example)
        if: env.RUN_TESTS == 'true' && matrix.bot == 'misc'
        run: flutter pub get
        working-directory: src/test/test_projects/dart_nested_flutter2/nested_flutter_example

      - name: flutter create (flutter_hello_world)
        if: startsWith(matrix.bot, 'flutter') && matrix.bot != 'flutter_snap'
        run: flutter create .
        working-directory: src/test/test_projects/flutter_hello_world

      - name: flutter create (flutter_hello_world_bazel)
        if: startsWith(matrix.bot, 'flutter') && matrix.bot != 'flutter_snap'
        run: flutter create .
        working-directory: src/test/test_projects/bazel_workspace/flutter_hello_world_bazel

      - name: flutter pub get (flutter_hello_world)
        if: startsWith(matrix.bot, 'flutter') && matrix.bot != 'flutter_snap'
        run: flutter packages get
        working-directory: src/test/test_projects/flutter_hello_world

      - name: flutter pub get (flutter_hello_world_bazel)
        if: startsWith(matrix.bot, 'flutter') && matrix.bot != 'flutter_snap'
        run: flutter packages get
        working-directory: src/test/test_projects/bazel_workspace/flutter_hello_world_bazel

      - name: ps -x (before)
        if: matrix.os != 'windows-latest'
        run: ps -x

      - name: npm test
        if: env.RUN_TESTS == 'true'
        run: npm test
        env:
          CI: true
          ELECTRON_NO_ATTACH_CONSOLE: 1
          DISPLAY: ":99.0"
          BOT: ${{ matrix.bot }}
          BUILD_VERSION: ${{ matrix.build-version }}
          LOGS_NAME: ${{ matrix.build-version }}
          FLUTTER_REPO_PATH: ${{ steps.flutter.outputs.flutter-sdk }}

      - name: npm run test-grammar
        if: matrix.bot == 'misc'
        run: npm run test-grammar

      - name: ps -x (after)
        if: matrix.os != 'windows-latest'
        run: ps -x

      - name: Store logs
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-logs-${{ matrix.build-version }}-${{ matrix.os }}-${{ matrix.bot }}
          path: .dart_code_test_logs
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Store test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.build-version }}-${{ matrix.os }}-${{ matrix.bot }}
          path: .test_results
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Store coverage
        uses: actions/upload-artifact@v7
        if: success() && matrix.build-version == 'stable'
        with:
          name: coverage-${{ matrix.build-version }}-${{ matrix.os }}-${{ matrix.bot }}
          path: coverage
          if-no-files-found: ignore

      - name: Store CPU profiles
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: cpu-profiles-${{ matrix.build-version }}-${{ matrix.os }}-${{ matrix.bot }}
          path: |
            /tmp/*.cpuprofile
            ${{ runner.temp }}/*.cpuprofile
            ${{ env.TMPDIR }}/*.cpuprofile
            ${{ env.TMP }}/*.cpuprofile
            ${{ env.TEMP }}/*.cpuprofile
          if-no-files-found: ignore

      - name: Store crash dumps
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: crash-dumps-${{ matrix.build-version }}-${{ matrix.os }}-${{ matrix.bot }}
          path: .crash_dumps
          include-hidden-files: true
          if-no-files-found: ignore

  link_check:
    name: Check Links (Lychee)
    needs: build_exclusions
    if: needs.build_exclusions.outputs.check_links == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --root-dir ./
            --exclude-all-private
            --exclude '\$\%7B[^}]+\%7D'
            --exclude "^file://"
            ./src/**/*.ts
            ./*.md
            ./**/*.license
            package.json

  # A single action based on the test outcome that can be used
  # as a required status check.
  merge-guard:
    permissions:
      contents: none
    name: Merge Guard
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Fail if the build check did not pass.
      - name: Check results
        if: needs.build.result != 'success'
        run: |
          echo "::error title=Merge Guard::One or more build jobs did not succeed (${{ needs.build.result }})."
          exit 1

  merge_artifacts:

    name: Merge Artifacts
    needs: [build_exclusions, build]
    # Using always() (to run on failure) will cause us to also run regardless of whether "build" ran, so
    # explicitly check that ran and passed or failed (and was not skipped/cancelled).
    if: always() && needs.build_exclusions.outputs.run_tests == 'true' && (needs.build.result == 'success' || needs.build.result == 'failure')
    runs-on: ubuntu-latest
    outputs:
      has_coverage: ${{ steps.merge_coverage.outcome == 'success' }}

    steps:

      - name: Merge logs
        uses: actions/upload-artifact/merge@v7
        if: always()
        with:
          name: test-logs
          pattern: test-logs-*
          separate-directories: true
          delete-merged: true
        continue-on-error: true # fails if empty

      - name: Merge test results
        uses: actions/upload-artifact/merge@v7
        if: always()
        with:
          name: test-results
          pattern: test-results-*
          separate-directories: true
          delete-merged: true
        continue-on-error: true # fails if empty

      - name: Merge coverage
        id: merge_coverage
        uses: actions/upload-artifact/merge@v7
        if: needs.build.result == 'success'
        with:
          name: coverage
          pattern: coverage-*
          delete-merged: true
        continue-on-error: true # fails if empty

      - name: Merge crash dumps
        uses: actions/upload-artifact/merge@v7
        if: always()
        with:
          name: crash-dumps
          pattern: crash-dumps-*
          separate-directories: true
          delete-merged: true
        continue-on-error: true # fails if empty

      - name: Merge CPU profiles
        uses: actions/upload-artifact/merge@v7
        if: always()
        with:
          name: cpu-profiles
          pattern: cpu-profiles-*
          separate-directories: true
          delete-merged: true
        continue-on-error: true # fails if empty

  upload_coverage:

    name: Send Coverage to Codecov
    needs: merge_artifacts
    if: needs.merge_artifacts.outputs.has_coverage == 'true'
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v7

      - name: Download coverage
        uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage

      - name: Upload coverage reports to Codecov with GitHub Action
        uses: codecov/codecov-action@v7
        with:
          directory: coverage
          verbose: true

  notify_failure:

    permissions:
      contents: none
    name: Notify Discord of Failure
    needs: build
    if: failure() && (github.event_name == 'push' || github.event_name == 'merge_group' || github.event_name == 'schedule') && (github.ref == 'refs/heads/master' || github.event.merge_group.base_ref == 'refs/heads/master') && github.repository == 'Dart-Code/Dart-Code'
    runs-on: ubuntu-latest

    steps:

      - name: Send notification to Discord
        run: 'Invoke-WebRequest -Headers @{ "Content-Type" = "application/json" } -Method Post -Body "{`"content`":`"Build failed on $($env:GITHUB_REF.Replace(`"refs/heads/`", `"`")): https://github.com/Dart-Code/Dart-Code/commit/$($env:GITHUB_SHA)/checks`"}" -Uri $env:DISCORD_WEBHOOK'
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
